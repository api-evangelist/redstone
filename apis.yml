aid: redstone
name: RedStone
description: >-
  RedStone is a modular blockchain oracle infrastructure provider delivering tamper-proof price
  feeds and off-chain data to smart contracts across 100+ EVM and non-EVM networks. It aggregates
  data from 20+ centralized and decentralized exchanges, signs each data package with the provider's
  key, and delivers it through three models: Pull (Core, on-demand data injected into a transaction
  via the EVM connector), Push (on-chain relayers that write prices to a feed contract), and a Hybrid
  ERC-7412 flow. RedStone also runs a public HTTP cache/gateway API for reading signed data packages
  and historical prices, publishes SDKs (TypeScript, Rust), chain connectors (EVM, Starknet, TON,
  Fuel, Radix, Casper), a CLI, and on-chain example contracts. It secures billions of dollars of
  value for 200+ DeFi protocols and supports Proof of Reserve and MEV-resistant (OEV) products.
